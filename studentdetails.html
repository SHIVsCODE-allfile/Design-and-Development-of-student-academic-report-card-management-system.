<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Student Report Card</title>
  <link rel="stylesheet" href="style2.css">

<body>

  <h1>Student Report Card</h1>

  <form id="reportForm" action="savereport.php" method="post">
    <table id="tableout">
      <tbody>
        <tr>
          <td>Student Name</td>
          <td><input type="text" id="studentname" name="studentName" placeholder="Enter student name" required></td>

        </tr>
        <tr>
          <td>Year</td>
    
    <td>
        <select id="year" name="year" required>
            <option value="" disabled selected>select the year</option>
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
            <option value="4th">4th</option>
        </select>
    </td>

        </tr>
        <tr>
          <td colspan="2">
            <table id="tablein">
              <thead>
                <tr>
                  <td>Subject</td>

                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <select id="subject1" name="subject1">
                      <option value="" disabled selected>Select subject</option>
                      <option value="Digital Logic and Design">Digital Logic and Design</option>

                      <option value="Linear Algebra">Linear Algebra</option>
                      <option value="Internet and Web Technologies">Internet and Web Technologies</option>
                      <option value="Foundation of Data Science">Foundation of Data Science</option>
                      <option value="other">other</option>
                    </select>
                  </td>
                  <td><input type="number" id="marks1" min="0" max="100" placeholder="0 - 100" name="marks1" oninput="calculateReport()"></td>
                  <td><input type="text" id="grade1" readonly placeholder="-" name="grade1"></td>
                  <td><input type="text" id="passfail1" readonly placeholder="-" name="pf1"></td>
                </tr>
                <tr>
                  <td>
                    <select id="subject2" name="subject2">

                  <td><input type="text" id="passfail2" readonly placeholder="-" name="pf2"></td>
                </tr>
                <tr>

                      <option value="Digital Logic and Design">Digital Logic and Design</option>
                      <option value="Problem Solving and Programming">Problem Solving and Programming</option>
                      <option value="Linear Algebra">Linear Algebra</option>
                      <option value="Internet and Web Technologies">Internet and Web Technologies</option>
                      <option value="Foundation of Data Science">Foundation of Data Science</option>
                      <option value="other">other</option>
                    </select>

                  <td>Total / Overall</td>
                  <td><input type="text" id="totalMarks" name="totalMarks" readonly placeholder="0 / 500"></td>
                  <td><input type="text" id="overallGrade" name="overallGrade" readonly placeholder="-"></td>

    </table>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button type="button" class="btn btn-print" onclick="window.print()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
